<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="styles/style_timer.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="scripts/main.js" async></script>
    <title>Multistopwatch</title>
  </head>
  <body>
    <header>
      <h1>Multistopwatch</h1>
      <div id="control-bar">
        <input type="text" placeholder="Enter Name" id="name-box"/>
        <input type="text" placeholder="Time" type="number" size="6" id="time-box"/>
        <button class="control styled">-</button>
        <input type="text" placeholder="Runs" type="number" size="6" id="runs-box"/>
        <button class="control styled">+</button>
      </div>
    </header> 

    <div class="timers-container">
      <div class="timer-cell middled">
        <div class="centered">
            <button id="add" class="timer styled" >
                +
            </button>  
        </div>
      </div>
    </div>

    
  </body>
</html>
